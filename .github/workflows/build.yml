name: Evolution System v5.1 - Clean Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilation Target - Windows x64 v5.1 (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Production Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Compiling Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Execute PyInstaller Production Build
        run: |
          pyinstaller --clean --onefile --noconsole --name="evolution_v5.1_final" evolution_core.py

      - name: Upload Windows Production Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evolution_v5.1_Windows_x64
          path: dist/evolution_v5.1_final.exe
          retention-days: 5
